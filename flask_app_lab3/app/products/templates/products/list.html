{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h2 class="fw-bold mb-4">Products</h2>
  <div class="row g-3">
    {% for p in products %}
    <div class="col-md-6">
      <div class="card p-3 shadow-sm">
        <h5>{{ p.title }}</h5>
        <p class="text-muted">{{ p.desc }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
