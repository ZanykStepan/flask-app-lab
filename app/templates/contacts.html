{% extends 'base.html' %}

{% block content %}
<section class="mt-4">
    <div class="text-center mb-4">
        <h1 class="fw-bold">Контакти</h1>
        <p class="opacity-75">Залиште своє повідомлення — і я обов’язково відповім!</p>
    </div>

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body">
            <form action="#" method="post" class="needs-validation">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Ім’я</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Введіть ім’я" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Введіть e-mail" required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label fw-semibold">Повідомлення</label>
                    <textarea class="form-control" id="message" name="message" placeholder="Введіть текст повідомлення" rows="5" required></textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary px-4">Надіслати</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
