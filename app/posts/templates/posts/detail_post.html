{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('posts.static', filename='css/posts.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="card mt-4 shadow post-card">
        <img src="{{ url_for('posts.static', filename='img/default.png') }}" class="card-img-top" style="max-height: 250px; object-fit: cover;" alt="Post Image">

        <div class="card-header d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-4 px-4">
            <span class="text-muted">{{ post.posted.strftime('%Y-%m-%d %H:%M') }}</span>
            <span class="badge bg-info fs-6">{{ post.category }}</span>
        </div>

        <div class="card-body px-4 pb-4">
            <h1 class="card-title display-5 fw-bold">{{ post.title }}</h1>
            <p class="text-muted fst-italic mb-4">Автор: {{ post.author }}</p>

            <div class="card-text fs-5" style="white-space: pre-wrap;">
                {{ post.content }}
            </div>

            <div class="mt-5 d-flex gap-2 border-top pt-3">
                <a href="{{ url_for('posts.update_post', id=post.id) }}" class="btn btn-warning">Редагувати</a>
                <a href="{{ url_for('posts.delete_post', id=post.id) }}" class="btn btn-danger">Видалити</a>
                <a href="{{ url_for('posts.get_posts') }}" class="btn btn-secondary ms-auto">Назад до списку</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
